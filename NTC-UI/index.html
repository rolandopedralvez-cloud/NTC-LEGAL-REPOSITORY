<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NTC Legal Repository</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  body { background: var(--tblr-body-bg); }
  .doc-card { cursor: pointer; transition: box-shadow .15s ease; }
  .doc-card:hover { box-shadow: 0 4px 14px rgba(0,0,0,.08); }
  .xref-link { cursor: pointer; }
  .section-block { border-left: 3px solid var(--tblr-primary); padding-left: 1rem; margin-bottom: 1.25rem; }
  .status-active { background: #d1f4e0; color: #1a7f4e; }
  .status-amended { background: #fff3cd; color: #8a6300; }
  .status-repealed { background: #fde2e2; color: #a11; }
  #detailView { display: none; }
  .highlight { background: #fff59d; }
</style>
</head>
<body>
<div class="page">

  <!-- Sidebar -->
  <aside class="navbar navbar-vertical navbar-expand-lg navbar-dark" style="background:#1e2938;">
    <div class="container-fluid">
      <h1 class="navbar-brand navbar-brand-autodark">
        <span class="text-white">NTC Legal Repository</span>
      </h1>
      <div class="navbar-collapse collapse show">
        <ul class="navbar-nav pt-lg-3" id="categoryNav">
          <li class="nav-item"><a class="nav-link active" href="#" data-cat="all"><span class="nav-link-icon"><i class="ti ti-book-2"></i></span><span class="nav-link-title">All Documents</span></a></li>
        </ul>
      </div>
    </div>
  </aside>

  <div class="page-wrapper">
    <!-- Top header -->
    <div class="page-header d-print-none">
      <div class="container-fluid">
        <div class="row g-2 align-items-center">
          <div class="col">
            <h2 class="page-title" id="pageTitle">All Documents</h2>
            <div class="text-secondary mt-1" id="pageSubtitle">NTC Region VII — Laws, Rules, and Regulations</div>
          </div>
          <div class="col-auto ms-auto">
            <input type="text" class="form-control" id="searchBox" placeholder="Search laws, MCs, sections..." style="min-width:260px;">
          </div>
        </div>
      </div>
    </div>

    <div class="page-body">
      <div class="container-fluid">

        <!-- List view -->
        <div id="listView" class="row row-cards"></div>

        <!-- Detail view -->
        <div id="detailView">
          <button class="btn btn-outline-secondary mb-3" onclick="showList()"><i class="ti ti-arrow-left"></i> Back to list</button>
          <div class="card">
            <div class="card-body" id="detailBody"></div>
          </div>
        </div>

      </div>
    </div>

    <footer class="footer footer-transparent d-print-none">
      <div class="container-fluid">
        <div class="text-secondary">Pilot build — 3 documents converted from region7.ntc.gov.ph. UI built on Tabler.</div>
      </div>
    </footer>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/js/tabler.min.js"></script>
<script src="data/documents.js"></script>
<script>
const docsById = Object.fromEntries(NTC_DOCUMENTS.map(d => [d.id, d]));
let currentCategory = "all";
let currentQuery = "";

function buildCategoryNav() {
  const cats = [...new Set(NTC_DOCUMENTS.map(d => d.category))];
  const nav = document.getElementById("categoryNav");
  cats.forEach(cat => {
    const li = document.createElement("li");
    li.className = "nav-item";
    li.innerHTML = `<a class="nav-link" href="#" data-cat="${cat}"><span class="nav-link-icon"><i class="ti ti-file-text"></i></span><span class="nav-link-title">${cat}</span></a>`;
    nav.appendChild(li);
  });
  nav.addEventListener("click", e => {
    const a = e.target.closest("a[data-cat]");
    if (!a) return;
    e.preventDefault();
    document.querySelectorAll("#categoryNav .nav-link").forEach(el => el.classList.remove("active"));
    a.classList.add("active");
    currentCategory = a.dataset.cat;
    document.getElementById("pageTitle").textContent = currentCategory === "all" ? "All Documents" : currentCategory;
    showList();
    renderList();
  });
}

function statusBadge(status) {
  return `<span class="badge status-${status}" style="text-transform:capitalize;">${status}</span>`;
}

function renderList() {
  const container = document.getElementById("listView");
  container.innerHTML = "";
  const q = currentQuery.trim().toLowerCase();

  const filtered = NTC_DOCUMENTS.filter(d => {
    const catMatch = currentCategory === "all" || d.category === currentCategory;
    if (!catMatch) return false;
    if (!q) return true;
    const haystack = (d.title + " " + d.tags.join(" ") + " " + d.sections.map(s => s.heading + " " + s.body).join(" ")).toLowerCase();
    return haystack.includes(q);
  });

  if (filtered.length === 0) {
    container.innerHTML = `<div class="col-12"><div class="empty"><p class="empty-title">No documents found</p><p class="empty-subtitle text-secondary">Try a different search term or category.</p></div></div>`;
    return;
  }

  filtered.forEach(d => {
    const col = document.createElement("div");
    col.className = "col-md-6 col-lg-4";
    col.innerHTML = `
      <div class="card doc-card h-100" onclick="showDetail('${d.id}')">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-start mb-2">
            <span class="badge bg-blue-lt">${d.shortTitle}</span>
            ${statusBadge(d.status)}
          </div>
          <h3 class="card-title mb-1" style="font-size:1rem;">${d.title}</h3>
          <div class="text-secondary small mb-2">${d.category} · Effective ${d.effective_date}</div>
          <div>${d.tags.map(t => `<span class="badge bg-secondary-lt me-1">${t}</span>`).join("")}</div>
        </div>
      </div>`;
    container.appendChild(col);
  });
}

function renderSections(doc) {
  return doc.sections.map(s => {
    let body = s.body;
    if (s.refs) {
      s.refs.forEach(refId => {
        const refDoc = docsById[refId];
        if (refDoc) {
          const re = new RegExp(refDoc.shortTitle.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), "g");
          body = body.replace(re, `<a href="#" class="xref-link" onclick="event.stopPropagation();showDetail('${refId}')">${refDoc.shortTitle}</a>`);
        }
      });
    }
    return `<div class="section-block"><h4>${s.heading}</h4><p class="mb-0">${body}</p></div>`;
  }).join("");
}

function renderCrossRefs(doc) {
  if (!doc.cross_references || doc.cross_references.length === 0) return "";
  const links = doc.cross_references.map(refId => {
    const refDoc = docsById[refId];
    if (!refDoc) return "";
    return `<a href="#" class="btn btn-outline-primary btn-sm me-2 mb-2" onclick="showDetail('${refId}')"><i class="ti ti-link"></i> ${refDoc.shortTitle}</a>`;
  }).join("");
  return `<div class="mt-4"><h4>Related Documents</h4>${links}</div>`;
}

function referencedBy(docId) {
  const refs = NTC_DOCUMENTS.filter(d => d.cross_references && d.cross_references.includes(docId));
  if (refs.length === 0) return "";
  const links = refs.map(d => `<a href="#" class="btn btn-outline-secondary btn-sm me-2 mb-2" onclick="showDetail('${d.id}')"><i class="ti ti-arrow-back-up"></i> ${d.shortTitle}</a>`).join("");
  return `<div class="mt-3"><h4>Referenced By</h4>${links}</div>`;
}

function showDetail(id) {
  const doc = docsById[id];
  if (!doc) return;
  document.getElementById("listView").style.display = "none";
  document.getElementById("detailView").style.display = "block";
  document.getElementById("detailBody").innerHTML = `
    <div class="d-flex justify-content-between align-items-start mb-3">
      <div>
        <div class="text-secondary small mb-1">${doc.category}</div>
        <h2 class="mb-1">${doc.title}</h2>
        <div>${statusBadge(doc.status)} <span class="text-secondary ms-2">Effective ${doc.effective_date}</span></div>
      </div>
    </div>
    <div class="mb-3">${doc.tags.map(t => `<span class="badge bg-secondary-lt me-1">${t}</span>`).join("")}</div>
    <hr>
    ${renderSections(doc)}
    ${renderCrossRefs(doc)}
    ${referencedBy(doc.id)}
  `;
  window.scrollTo(0,0);
}

function showList() {
  document.getElementById("detailView").style.display = "none";
  document.getElementById("listView").style.display = "flex";
}

document.getElementById("searchBox").addEventListener("input", e => {
  currentQuery = e.target.value;
  renderList();
});

buildCategoryNav();
renderList();
</script>
</body>
</html>
